source_file: programs/cat.lisp
in_source: |-
  ; cat: echo every input byte to output

  (defisr
    (setq c (read))
    (if (!= c 0)
      (print-char c)
      (halt)))

  (loop 1 0)
input_file: input/cat.txt
in_stdin: |-
  10 h
  300 e
  600 l
  900 l
  1200 o
  1500 \n
  1800 \0
out_stdout: |
  hello
