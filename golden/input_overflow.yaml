source_file: programs/cat.lisp
in_source: |-
  ; cat: echo every input byte to output

  (defisr
    (setq c (read))
    (if (!= c 0)
      (print-char c)
      (halt)))

  (loop 1 0)
input_file: input/input_overflow.txt
in_stdin: |-
  # Demonstrate single-register input: chars arrive 2 ticks apart.
  # 'h' lands at tick 5.
  # 'e','l','l','o' arrive while the register still holds 'h' -> all dropped.
  # Only 'h' is ever processed.
  5 h
  7 e
  9 l
  11 l
  13 o
  1000 \0
out_stdout: |-
  h
